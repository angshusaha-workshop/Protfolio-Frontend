# Netlify build settings for this Vite + React app.
# Connect this repo in Netlify; these values apply automatically.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (useful if you add client-side routes later)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
